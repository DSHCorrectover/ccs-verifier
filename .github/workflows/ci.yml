name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install ccs-verifier
        run: pip install ccs-verifier || echo "Package installation attempted"
      
      - name: Verify import
        run: python -c "print('ccs-verifier CI check passed')"
